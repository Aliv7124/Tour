<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incredible Voyages — Bespoke India Journeys</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --indigo:#161A38;
    --indigo-2:#20264F;
    --marigold:#F2A93B;
    --maroon:#7E2130;
    --sandstone:#D9A566;
    --ivory:#F7F1E4;
    --ink:#100E1C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--indigo);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ivory);
    overflow-x:hidden;
  }
  h1,h2,h3,h4,.display-font{
    font-family:'Fraunces',serif;
    letter-spacing:.2px;
  }
  #bg-canvas{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:0;
    display:block;
    pointer-events:none;
  }
  #intro{
    position:fixed;inset:0;
    background:var(--ink);
    z-index:999;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #intro.hide{opacity:0;visibility:hidden;pointer-events:none;}
  #intro-canvas{position:absolute;inset:0;pointer-events:none;}
  #intro-title{
    position:relative;z-index:2;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-style:italic;
    color:var(--marigold);
    font-size:clamp(1.6rem,5vw,3rem);
    opacity:0;
    animation:introFade 1s ease forwards;
    text-align:center;
    letter-spacing:1px;
  }
  @keyframes introFade{
    0%{opacity:0; transform:scale(.85);}
    40%{opacity:1; transform:scale(1);}
    100%{opacity:1; transform:scale(1);}
  }
  .app-wrap{position:relative;z-index:1;}

  nav.iv-nav{
    background:rgba(22,26,56,.72);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(242,169,59,.25);
  }
  .navbar-brand{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    color:var(--marigold)!important;
    font-size:1.5rem;
  }
  .nav-link{
    color:var(--ivory)!important;
    opacity:.8;
    margin:0 .6rem;
    font-weight:500;
    position:relative;
  }
  .nav-link.active{opacity:1;color:var(--marigold)!important;}

  .hero-section{
    min-height:92vh;
    display:flex;
    align-items:center;
    padding-top:5rem;
    position:relative;
  }
  .hero-bg-img{
    position:absolute;
    top:0;right:0;
    width:46%;
    height:100%;
    background-image:url('https://picsum.photos/seed/india-hero-taj/900/1200');
    background-size:cover;
    background-position:center;
    -webkit-mask-image:linear-gradient(90deg,transparent,black 30%);
    mask-image:linear-gradient(90deg,transparent,black 30%);
    opacity:.55;
    transform-origin:bottom center;
    animation:treeSway 4.5s ease-in-out infinite;
  }
  @keyframes treeSway{
    0%,100%{transform:rotate(0deg) scale(1);}
    25%{transform:rotate(0.6deg) scale(1.003);}
    50%{transform:rotate(-0.4deg) scale(1);}
    75%{transform:rotate(0.5deg) scale(1.002);}
  }
  .leaf-accent{
    position:absolute;
    font-size:2.2rem;
    color:rgba(242,169,59,.35);
    transform-origin:bottom center;
    animation:leafShake 2.6s ease-in-out infinite;
    pointer-events:none;
    user-select:none;
  }
  @keyframes leafShake{
    0%,100%{transform:rotate(-6deg);}
    50%{transform:rotate(8deg);}
  }
  .review-avatar{
    width:52px;height:52px;border-radius:50%;
    object-fit:cover;
    border:2px solid var(--marigold);
  }
  .stars{color:var(--marigold); letter-spacing:2px; font-size:.9rem;}
  .snow-layer{
    position:absolute;inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .snowflake{
    position:absolute;

    background:#fff;

  @keyframes snowfall{

  .eyebrow-line{

  }
  .hero-title{

  .btn-outline-cream{

  .card-glass{

    .hero-bg-img{
      width:100%;
      height:52%;
      top:48%;
      right:0;

  .auth-login-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.25) 50%,transparent 75%);transform:translateX(-120%);transition:transform .55s ease}

  .auth-profile{position:relative}
  .auth-profile-btn{display:flex;align-items:center;gap:.55rem;background:rgba(247,241,228,.07);border:1px solid rgba(242,169,59,.4);color:var(--ivory);border-radius:999px;padding:.3rem .65rem .3rem .35rem;cursor:pointer;transition:all .25s ease}
  .auth-profile-btn:hover{background:rgba(242,169,59,.13);border-color:var(--marigold);transform:translateY(-1px)}
  .auth-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--marigold),#d47c19);color:var(--ink);font-weight:800;font-size:.8rem;box-shadow:0 3px 12px rgba(242,169,59,.25)}
  .auth-name{font-size:.82rem;font-weight:650;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .auth-chevron{font-size:.65rem;transition:transform .2s ease}.auth-chevron.open{transform:rotate(180deg)}
  .auth-menu{position:absolute;right:0;top:calc(100% + .65rem);width:220px;background:rgba(25,30,65,.98);border:1px solid rgba(242,169,59,.28);border-radius:12px;padding:.55rem;box-shadow:0 18px 45px rgba(0,0,0,.35);z-index:1200;animation:authMenuIn .18s ease-out}
  @keyframes authMenuIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .auth-menu-head{padding:.7rem .75rem;border-bottom:1px solid rgba(247,241,228,.1);margin-bottom:.35rem}
  .auth-menu-name{font-weight:750;font-size:.92rem}.auth-menu-email{font-size:.72rem;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.15rem}
  .auth-menu-item{width:100%;border:0;background:transparent;color:var(--ivory);text-align:left;border-radius:8px;padding:.65rem .75rem;font-size:.82rem;cursor:pointer;transition:background .2s,color .2s}
  .auth-menu-item:hover{background:rgba(242,169,59,.12);color:var(--marigold)}
  .auth-menu-item.logout:hover{background:rgba(255,100,100,.1);color:#ffb4b4}
  .iv-auth-overlay{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:99999!important;background:rgba(5,8,24,.78);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex!important;align-items:center!important;justify-content:center!important;padding:20px;overflow-y:auto;box-sizing:border-box}.iv-auth-dialog{width:100%;max-width:480px;margin:0!important;animation:authDialogIn .25s ease-out;position:relative}.iv-auth-dialog .modal-content{overflow:hidden;width:100%;box-sizing:border-box}
  @keyframes authDialogIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .auth-brand{display:flex;align-items:center;gap:.65rem;margin-bottom:1rem}.auth-brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--marigold),#d47c19);color:var(--ink);font-size:1.15rem;box-shadow:0 8px 20px rgba(242,169,59,.2)}
  .auth-brand-title{font-family:'Fraunces',serif;font-size:1.2rem}.auth-brand-sub{font-size:.7rem;opacity:.55;margin-top:.1rem}
  .auth-mode{display:flex;background:rgba(247,241,228,.05);padding:4px;border-radius:9px;margin-bottom:1.2rem}.auth-mode button{flex:1;border:0;background:transparent;color:var(--ivory);padding:.55rem;border-radius:7px;font-size:.8rem;font-weight:650;cursor:pointer;transition:all .2s}.auth-mode button.active{background:var(--marigold);color:var(--ink);box-shadow:0 4px 12px rgba(242,169,59,.2)}
  .auth-input-wrap{position:relative}.auth-input-wrap .auth-field-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}.auth-input-wrap .form-control{padding-left:2.35rem}
  .auth-submit{width:100%;padding:.72rem!important;font-weight:750;position:relative;overflow:hidden}.auth-submit:hover{transform:translateY(-1px)}
  @media(max-width:767px){.auth-actions{margin-left:0;margin-top:.8rem;flex-wrap:wrap}.auth-menu{right:auto;left:0}.auth-name{max-width:90px}}

  /* ===== FRONTEND AUTHENTICATION & BOOKING ===== */
  .auth-actions{

    align-items:center;

    margin-left:1rem;
  }

<body>

<div id="intro">
  <canvas id="intro-canvas"></canvas>
  <div id="intro-title">INCREDIBLE&nbsp;VOYAGES</div>
</div>

<canvas id="bg-canvas"></canvas>
<div id="root" class="app-wrap"></div>

<script>
/* ============ INTRO 3D ANIMATION (mandala burst, ~1s) ============ */
(function(){
  const canvas = document.getElementById('intro-canvas');
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 6;

  const group = new THREE.Group();
  scene.add(group);

  const colors = [0xF2A93B, 0x7E2130, 0xD9A566];
  const geo = new THREE.OctahedronGeometry(0.18, 0);
  const count = 60;
  const meshes = [];
  for(let i=0;i<count;i++){
    const mat = new THREE.MeshBasicMaterial({color: colors[i%colors.length], transparent:true, opacity:0.9});
    const m = new THREE.Mesh(geo, mat);
    const angle = (i/count) * Math.PI * 2;
    const radius = 0.2;
    m.userData = {
      angle,
      targetRadius: 2.2 + Math.random()*1.6,
      speed: 0.5 + Math.random()*0.5,
      spin: Math.random()*0.05
    };
    m.position.set(Math.cos(angle)*radius, Math.sin(angle)*radius, 0);
    group.add(m);
    meshes.push(m);
  }

  let start = null;
  function animateIntro(ts){
    if(!start) start = ts;
    const t = Math.min((ts-start)/1000, 1);
    const ease = 1 - Math.pow(1-t, 3);
    meshes.forEach(m=>{
      const r = m.userData.targetRadius * ease;
      m.position.x = Math.cos(m.userData.angle + ease*2) * r;
      m.position.y = Math.sin(m.userData.angle + ease*2) * r;
      m.rotation.x += m.userData.spin;
      m.rotation.y += m.userData.spin;
      m.material.opacity = 0.9 * (1-ease*0.3);
    });
    group.rotation.z = ease * 1.2;
    camera.position.z = 6 - ease*1.5;
    renderer.render(scene, camera);
    if(t<1){
      requestAnimationFrame(animateIntro);
    }
  }
  requestAnimationFrame(animateIntro);

  window.addEventListener('resize', ()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
  });

  setTimeout(()=>{
    document.getElementById('intro').classList.add('hide');
  }, 1050);
})();

/* ============ PERSISTENT ANIMATED 3D BACKGROUND ============ */
(function(){
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 10;

  // Starfield / floating spice-dust particles
  const particleCount = 1400;
  const positions = new Float32Array(particleCount*3);
  const colorsArr = new Float32Array(particleCount*3);
  const palette = [
    new THREE.Color(0xF2A93B),
    new THREE.Color(0xD9A566),
    new THREE.Color(0x7E2130),
    new THREE.Color(0xF7F1E4)
  ];
  for(let i=0;i<particleCount;i++){
    positions[i*3] = (Math.random()-0.5)*30;
    positions[i*3+1] = (Math.random()-0.5)*30;
    positions[i*3+2] = (Math.random()-0.5)*20 - 5;
    const c = palette[Math.floor(Math.random()*palette.length)];
    colorsArr[i*3]=c.r; colorsArr[i*3+1]=c.g; colorsArr[i*3+2]=c.b;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(colorsArr,3));
  const pMat = new THREE.PointsMaterial({size:0.06, vertexColors:true, transparent:true, opacity:0.75});
  const points = new THREE.Points(pGeo, pMat);
  scene.add(points);

  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', (e)=>{
    mouseX = (e.clientX/window.innerWidth - 0.5);
    mouseY = (e.clientY/window.innerHeight - 0.5);
  });

  function animate(){
    requestAnimationFrame(animate);
    points.rotation.y += 0.0006;
    points.rotation.x += 0.0002;
    camera.position.x += (mouseX*1.5 - camera.position.x)*0.02;
    camera.position.y += (-mouseY*1.5 - camera.position.y)*0.02;
    camera.lookAt(0,0,0);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', ()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
  });
})();
</script>

function CountUp({end, duration=1500, suffix="", decimals=0}){
  const [value, setValue] = useState(0);
  const ref = React.useRef(null);
  const [started, setStarted] = useState(false);

  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting && !started){
          setStarted(true);
        }
      });
    }, {threshold:0.4});
    obs.observe(el);
    return ()=>obs.disconnect();
  }, [started]);

  useEffect(()=>{
    if(!started) return;
    let startTime = null;
    function step(ts){
      if(!startTime) startTime = ts;
      const progress = Math.min((ts-startTime)/duration, 1);
      const eased = 1 - Math.pow(1-progress, 3);
      setValue(end * eased);
      if(progress < 1) requestAnimationFrame(step);
      else setValue(end);
    }
    requestAnimationFrame(step);
  }, [started, end, duration]);

  const display = decimals > 0 ? value.toFixed(decimals) : Math.floor(value).toLocaleString();
  return <span ref={ref}>{display}{suffix}</span>;
}

function AuthModal({show,onClose}){
  const [mode,setMode] = useState("login");
  const [name,setName] = useState("");
  const [email,setEmail] = useState("");
  const [password,setPassword] = useState("");
  const [error,setError] = useState("");

  useEffect(()=>{
    if(show){
      setError("");
      setName("");
      setEmail("");
      setPassword("");
      const previousOverflow=document.body.style.overflow;
      document.body.style.overflow="hidden";
      const onKey=(e)=>{ if(e.key==="Escape") onClose(); };
      document.addEventListener("keydown",onKey);
      return ()=>{ document.body.style.overflow=previousOverflow; document.removeEventListener("keydown",onKey); };
    }
  },[show]);

  if(!show) return null;

  function submit(e){
    e.preventDefault();
    setError("");

    const cleanEmail = email.trim().toLowerCase();

    if(!cleanEmail || !password){
      setError("Please enter your email and password.");
      return;
    }

    if(mode === "signup"){
      if(!name.trim()){
        setError("Please enter your name.");
        return;
      }

      if(password.length < 6){
        setError("Password must be at least 6 characters.");
        return;
      }

      const account = {
        name:name.trim(),
        email:cleanEmail,
        password:password
      };

      localStorage.setItem("iv_account",JSON.stringify(account));
      localStorage.setItem("iv_user",JSON.stringify({
        name:account.name,
        email:account.email
      }));

      window.dispatchEvent(new Event("iv-auth-change"));
      onClose();
      return;
    }

    const saved = localStorage.getItem("iv_account");

    if(!saved){
      setError("No account found. Please sign up first.");
      return;
    }

    try{
      const account = JSON.parse(saved);

      if(account.email !== cleanEmail || account.password !== password){
        setError("Incorrect email or password.");
        return;
      }

      localStorage.setItem("iv_user",JSON.stringify({
        name:account.name,
        email:account.email
      }));

      window.dispatchEvent(new Event("iv-auth-change"));
      onClose();
    }catch{
      setError("Unable to read your account.");
    }
  }

  return (
    <div className="iv-auth-overlay" role="dialog" aria-modal="true" onMouseDown={(e)=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="iv-auth-dialog" onMouseDown={e=>e.stopPropagation()}>
        <div className="modal-content iv-modal">

          <div className="modal-header">
            <div><div className="auth-brand"><span className="auth-brand-mark">✦</span><div><div className="auth-brand-title">Incredible Voyages</div><div className="auth-brand-sub">Your journey starts here</div></div></div></div>
            <button type="button" className="btn-close" onClick={onClose}></button>
          </div>

          <form onSubmit={submit}>
            <div className="modal-body">
              <div className="auth-mode">
                <button type="button" className={mode==="login"?"active":""} onClick={()=>{setMode("login");setError("")}}>Login</button>
                <button type="button" className={mode==="signup"?"active":""} onClick={()=>{setMode("signup");setError("")}}>Create Account</button>
              </div>

              {mode==="signup" && (
                <div className="mb-3">
                  <label className="form-label">Full Name</label>
                  <div className="auth-input-wrap"><span className="auth-field-icon">♙</span><input
                    type="text"
                    className="form-control"
                    value={name}
                    onChange={e=>setName(e.target.value)}
                    placeholder="Your name"
                  /></div>
                </div>
              )}

              <div className="mb-3">
                <label className="form-label">Email Address</label>
                <input
                  type="email"
                  className="form-control"
                  value={email}
                  onChange={e=>setEmail(e.target.value)}
                  placeholder="you@example.com"
                />
              </div>

              <div className="mb-3">
                <label className="form-label">Password</label>
                <input
                  type="password"
                  className="form-control"
                  value={password}
                  onChange={e=>setPassword(e.target.value)}
                  placeholder="Minimum 6 characters"
                />
              </div>

              <div className="auth-error">{error}</div>

              <div className="text-center mt-2">
                {mode==="login" ? (
                  <>Don't have an account? <span className="auth-switch" onClick={()=>{
                    setMode("signup");setError("");
                  }}>Sign up</span></>
                ) : (
                  <>Already have an account? <span className="auth-switch" onClick={()=>{
                    setMode("login");setError("");
                  }}>Login</span></>
                )}
              </div>

            </div>

            <div className="modal-footer">
              <button type="button" className="btn btn-outline-light" onClick={onClose}>
                Cancel
              </button>
              <button type="submit" className="btn btn-primary auth-submit">
                {mode==="login" ? "Login Securely" : "Create My Account"}
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  );
}

        setUser(null);
      }
    };

    loadUser();
    window.addEventListener("iv-auth-change",loadUser);
    return ()=>window.removeEventListener("iv-auth-change",loadUser);
  },[]);

  useEffect(()=>{
    if(user && selectedPackage && showAuth){
      setShowAuth(false);
      setShowBooking(true);
    }
  },[user]);

  function handleBooking(pkg){
    setSelectedPackage(pkg);
    setBookingSuccess(false);

    if(!user){
      setShowAuth(true);
      return;
    }

    setShowBooking(true);
  }

  function confirmBooking(e){
    e.preventDefault();

    if(!travelDate){
      alert("Please select your travel date.");
      return;
    }

    const id = "IV-" + Math.random().toString(36).substring(2,8).toUpperCase();

    const booking = {
      bookingId:id,
      packageName:selectedPackage.name,
      price:selectedPackage.price,
      travellers:Number(travellers),
      travelDate:travelDate,
      customer:user.name,
      email:user.email,
      createdAt:new Date().toISOString()
    };

    localStorage.setItem("iv_last_booking",JSON.stringify(booking));
    setBookingId(id);
    setBookingSuccess(true);
  }

  return (
    <div className="section-pad" style={{paddingTop:'8rem'}}>
      <div className="container">

        <div className="mb-2">
          <span className="eyebrow-line"></span>Curated Itineraries
        </div>

        <h2 className="mb-4">
          Journeys ready to <em style={{color:'var(--marigold)',fontStyle:'italic'}}>customise</em>
        </h2>

        <p style={{opacity:.7,fontSize:'.9rem'}} className="mb-4">
          All prices shown are starting prices and may vary by travel dates,
          hotel category, transport and customisation.
        </p>

        <div className="row g-4">

          {PACKAGES.map(p=>(
            <div className="col-md-6" key={p.name}>

              <div className="card-glass h-100 overflow-hidden d-flex flex-column">

                <div style={{
                  height:'220px',
                  backgroundImage:'url('+p.img+')',
                  backgroundSize:'cover',
                  backgroundPosition:'center',
                  position:'relative'
                }}>
                  <div style={{
                    position:'absolute',
                    inset:0,
                    background:'linear-gradient(180deg,rgba(16,14,28,0) 40%,rgba(16,14,28,.85))'
                  }}></div>

                  <div style={{
                    position:'absolute',
                    bottom:'10px',
                    right:'16px',
                    textAlign:'right'
                  }}>
                    <small style={{opacity:.7}}>Starting from</small>
                    <div className="price-tag">{p.price}</div>
                  </div>
                </div>

                <div className="p-4 d-flex flex-column flex-grow-1">

                  <h5 className="mb-1">{p.name}</h5>

                  <div style={{opacity:.65,fontSize:'.85rem'}} className="mb-2">
                    {p.days} &nbsp;·&nbsp; {p.cities}
                  </div>

                  <p style={{opacity:.78,fontSize:'.92rem'}} className="flex-grow-1">
                    {p.desc}
                  </p>

                  <button
                    className="btn btn-marigold mt-2 align-self-start booking-btn"
                    onClick={()=>handleBooking(p)}
                  >
                    Book Journey
                  </button>

                </div>
              </div>

            </div>
          ))}

        </div>
      </div>

      <AuthModal
        show={showAuth}
        onClose={()=>setShowAuth(false)}
      />

      {showBooking && selectedPackage && (
        <div className="modal d-block" style={{background:"rgba(0,0,0,.65)"}}>
          <div className="modal-dialog modal-dialog-centered">
            <div className="modal-content iv-modal">

              <div className="modal-header">
                <h5 className="modal-title">Book Your Journey</h5>
                <button
                  type="button"
                  className="btn-close"
                  onClick={()=>{
                    setShowBooking(false);
                    setBookingSuccess(false);
                  }}
                ></button>
              </div>

              {!bookingSuccess ? (

                <form onSubmit={confirmBooking}>

                  <div className="modal-body">

                    <div className="booking-summary mb-3">
                      <strong>{selectedPackage.name}</strong>
                      <div className="mt-1">{selectedPackage.cities}</div>
                      <div className="mt-2">
                        Starting price: <strong>{selectedPackage.price}</strong>
                      </div>
                    </div>

                    <div className="mb-3">
                      <label className="form-label">Travel Date</label>
                      <input
                        type="date"
                        className="form-control"
                        value={travelDate}
                        min={new Date().toISOString().split("T")[0]}
                        onChange={e=>setTravelDate(e.target.value)}
                        required
                      />
                    </div>

                    <div className="mb-3">
                      <label className="form-label">Number of Travellers</label>
                      <select
                        className="form-select"
                        value={travellers}
                        onChange={e=>setTravellers(e.target.value)}
                      >
                        {Array.from({length:12},(_,i)=>i+1).map(n=>(
                          <option value={n} key={n}>
                            {n} {n===1 ? "Traveller" : "Travellers"}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="booking-note">
                      Logged in as {user?.email}.
                      <br/>
                      Frontend demo only — no payment is processed.
                    </div>

                  </div>

                  <div className="modal-footer">
                    <button
                      type="button"
                      className="btn btn-outline-light"
                      onClick={()=>setShowBooking(false)}
                    >
                      Cancel
                    </button>

                    <button type="submit" className="btn btn-primary">
                      Confirm Booking
                    </button>
                  </div>

                </form>

              ) : (

                <div className="modal-body">

                  <div className="booking-success">
                    <div style={{fontSize:'3rem',color:'var(--marigold)'}}>✓</div>

                    <h3>Booking Request Created</h3>

                    <p>Thank you, {user?.name}.</p>

                    <p>
                      Your request for <strong>{selectedPackage.name}</strong>
                      {" "}has been saved.
                    </p>

                    <p>
                      Booking ID:<br/>
                      <span className="booking-id">{bookingId}</span>
                    </p>

                    <p className="booking-note">
                      This demo stores the booking only in this browser.
                    </p>
                  </div>

                  <div className="text-center">
                    <button
                      className="btn btn-primary"
                      onClick={()=>{
                        setShowBooking(false);
                        setBookingSuccess(false);
                        setTravelDate("");
                      }}
                    >
                      Done
                    </button>
                  </div>

                </div>

              )}

            </div>
          </div>
        </div>
      )}

    </div>
  );
}

function Contact({prefillDestination}){
  const [sent, setSent] = useState(false);
  const [destination, setDestination] = useState(prefillDestination || "");

  useEffect(()=>{
    setDestination(prefillDestination || "");
  }, [prefillDestination]);

  function submit(e){
    e.preventDefault();
    setSent(true);
  }
  return (
    <div className="section-pad" style={{paddingTop:'8rem'}}>
      <div className="container">
        <div className="mb-2"><span className="eyebrow-line"></span>Get in touch</div>
        <h2 className="mb-5">Let's plan your <em style={{color:'var(--marigold)',fontStyle:'italic'}}>India journey</em></h2>
        <div className="row g-5">
          <div className="col-lg-5">
            <div className="contact-info-item">
              <div style={{opacity:.6,fontSize:'.8rem'}}>Studio</div>
              <div><span className="map-pin"></span>C-14, Defence Colony, New Delhi 110024</div>
            </div>
            <div className="contact-info-item">
              <div style={{opacity:.6,fontSize:'.8rem'}}>Call</div>
              <div>+91 98100 22345</div>
            </div>
            <div className="contact-info-item">
              <div style={{opacity:.6,fontSize:'.8rem'}}>Email</div>
              <div>journeys@incrediblevoyages.in</div>
            </div>
            <div className="contact-info-item">
              <div style={{opacity:.6,fontSize:'.8rem'}}>Hours</div>
              <div>Mon – Sat, 9:30am – 7:00pm IST</div>
            </div>
          </div>
          <div className="col-lg-7">
            <div className="card-glass p-4 p-md-5">
              {sent ? (
                <div>
                  <h5 className="mb-2" style={{color:'var(--marigold)'}}>Message sent</h5>
                  <p style={{opacity:.8}}>A trip designer will write back within one business day.</p>
                </div>
              ) : (
                <form onSubmit={submit}>
                  <div className="row g-3">
                    <div className="col-md-6">
                      <label className="form-label" style={{fontSize:'.85rem',opacity:.75}}>Full name</label>
                      <input required className="form-control form-control-iv" placeholder="Your name" />
                    </div>
                    <div className="col-md-6">
                      <label className="form-label" style={{fontSize:'.85rem',opacity:.75}}>Email</label>
                      <input required type="email" className="form-control form-control-iv" placeholder="you@example.com" />
                    </div>
                    <div className="col-md-6">
                      <label className="form-label" style={{fontSize:'.85rem',opacity:.75}}>Preferred destination</label>
                      <input className="form-control form-control-iv" placeholder="e.g. Rajasthan" value={destination} onChange={(e)=>setDestination(e.target.value)} />
                    </div>
                    <div className="col-md-6">
                      <label className="form-label" style={{fontSize:'.85rem',opacity:.75}}>Travel month</label>
                      <input className="form-control form-control-iv" placeholder="e.g. December 2026" />
                    </div>
                    <div className="col-12">
                      <label className="form-label" style={{fontSize:'.85rem',opacity:.75}}>Tell us about your trip</label>
                      <textarea rows="4" className="form-control form-control-iv" placeholder="Group size, interests, pace..."></textarea>
                    </div>
                    <div className="col-12">
                      <button type="submit" className="btn btn-marigold w-100">Send Enquiry</button>
                    </div>
                  </div>
                </form>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Footer({setPage}){
  const [email, setEmail] = useState("");
  const [joined, setJoined] = useState(false);
  return (
    <footer>
      <div className="container">
        <div className="row g-4">
          <div className="col-lg-4">
            <div className="footer-brand mb-3">Incredible Voyages</div>
            <p style={{fontSize:'.9rem', maxWidth:'320px', opacity:.75}}>
              A Delhi-based travel studio designing private, small-group journeys
              across India since 2008. Eighteen years of local knowledge, on every itinerary.
            </p>
            <div className="mt-3">
              <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" className="footer-social" aria-label="Instagram">IG</a>
              <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" className="footer-social" aria-label="Facebook">FB</a>
              <a href="https://x.com" target="_blank" rel="noopener noreferrer" className="footer-social" aria-label="X">X</a>
              <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" className="footer-social" aria-label="YouTube">YT</a>
            </div>
          </div>
          <div className="col-6 col-lg-2">
            <div className="footer-heading">Explore</div>
            <a className="footer-link" onClick={()=>setPage("Home")}>Home</a>
            <a className="footer-link" onClick={()=>setPage("Destinations")}>Destinations</a>
            <a className="footer-link" onClick={()=>setPage("Packages")}>Packages</a>
            <a className="footer-link" onClick={()=>setPage("Contact")}>Contact</a>
          </div>
          <div className="col-6 col-lg-2">
            <div className="footer-heading">Company</div>
            <a className="footer-link" onClick={()=>setPage("Home")}>About Us</a>
            <a className="footer-link" onClick={()=>setPage("Packages")}>Our Guides</a>
            <a className="footer-link" onClick={()=>setPage("Contact")}>Careers</a>
            <a className="footer-link" onClick={()=>{setPage("Home"); setTimeout(()=>window.scrollTo({top:document.body.scrollHeight*0.55, behavior:'smooth'}),50);}}>Traveller Reviews</a>
          </div>
          <div className="col-6 col-lg-2">
            <div className="footer-heading">Support</div>
            <a className="footer-link" onClick={()=>setPage("Contact")}>FAQs</a>
            <a className="footer-link" onClick={()=>setPage("Contact")}>Booking Terms</a>
            <a className="footer-link" onClick={()=>setPage("Contact")}>Travel Insurance</a>
            <a className="footer-link" onClick={()=>setPage("Contact")}>Privacy Policy</a>
          </div>
          <div className="col-lg-2">
            <div className="footer-heading">Stay in the loop</div>
            <p style={{fontSize:'.85rem', opacity:.7}}>New itineraries, once a month.</p>
            {joined ? (
              <div style={{color:'var(--marigold)', fontSize:'.85rem'}}>Subscribed — thank you.</div>
            ) : (
              <form className="d-flex" onSubmit={(e)=>{e.preventDefault(); if(email) setJoined(true);}}>
                <input
                  type="email" required value={email}
                  onChange={(e)=>setEmail(e.target.value)}
                  className="form-control newsletter-input" placeholder="Email"
                  style={{fontSize:'.85rem'}}
                />
                <button type="submit" className="btn btn-marigold" style={{borderRadius:'0 2px 2px 0', padding:'.5rem .9rem'}}>→</button>
              </form>
            )}
          </div>
        </div>
        <div className="footer-bottom d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
          <div>© 2026 Incredible Voyages. All rights reserved. &nbsp;·&nbsp; Frontend demo</div>
          <div style={{fontFamily:'Fraunces, serif', fontStyle:'italic'}}>Journeys, not itineraries.</div>
        </div>
      </div>
    </footer>
  );
}

function App(){
  const [page, setPage] = useState("Home");
  const [prefillDestination, setPrefillDestination] = useState("");
  useEffect(()=>{ window.scrollTo(0,0); }, [page]);
  function goToContact(destination){
    setPrefillDestination(destination || "");
    setPage("Contact");
    
  }
  return (
    <React.Fragment>
      <NavBar page={page} setPage={setPage} />
      {page==="Home" && <Home setPage={setPage} goToContact={goToContact} />}
      {page==="Destinations" && <Destinations goToContact={goToContact} />}
      {page==="Packages" && <Packages setPage={setPage} />}
      {page==="Contact" && <Contact prefillDestination={prefillDestination} />}
      <Footer setPage={setPage} />
    </React.Fragment>
  );
} 

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
